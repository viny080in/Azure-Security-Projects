
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: azure-security-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_RESTRICT_FILE_ACCESS_TO=/reports
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
    volumes:
      - n8n_data:/home/node/.n8n
      - ./reports:/reports
      - ./incidents:/files
      - C:/Azure-Security-Projects/incidents:/incidents
    restart: unless-stopped

volumes:
  n8n_data: